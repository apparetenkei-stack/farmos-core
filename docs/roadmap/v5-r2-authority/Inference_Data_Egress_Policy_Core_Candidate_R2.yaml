  direct_hermes_to_provider_path: PROHIBITED
  fallback_may_widen_allowed_provider_set: false
  local_provider_automatically_trusted: false
audit_evidence_fields:
- correlation_id
- timestamp
- verified_scope
- purpose_id
- highest_classification
- platform_policy_hash
- tenant_or_installation_policy_hash
- provider_assurance_hash
- redaction_obligations
- allowed_provider_set
- selected_provider
- reason_codes
- input_manifest_hash
raw_sensitive_payload_in_egress_ledger: false
current_single_installation:
